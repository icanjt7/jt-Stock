name: Deploy Backend to HuggingFace Space

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push backend to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          # HF Space 저장소 클론
          git clone https://icanjt7:${HF_TOKEN}@huggingface.co/spaces/icanjt7/video-studio-api hf_space

          # backend/ 파일을 Space 루트로 복사
          cp -r backend/* hf_space/

          cd hf_space
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from GitHub: ${{ github.sha }}"
          git push
